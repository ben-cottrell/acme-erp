apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: acme-erp-local
build:
  tagPolicy:
    inputDigest: {}
  local:
    push: false
  artifacts:
    - image: acme-erp/sales-api
      context: .
      docker:
        dockerfile: src/Sales/Acme.Erp.Sales.Api/Dockerfile
    - image: acme-erp/sales-ui
      context: .
      docker:
        dockerfile: src/Sales/Acme.Erp.Sales.Ui/Dockerfile
    - image: acme-erp/purchasing-api
      context: .
      docker:
        dockerfile: src/Purchasing/Acme.Erp.Purchasing.Api/Dockerfile
    - image: acme-erp/purchasing-ui
      context: .
      docker:
        dockerfile: src/Purchasing/Acme.Erp.Purchasing.Ui/Dockerfile
    - image: acme-erp/inventory-management-api
      context: .
      docker:
        dockerfile: src/InventoryManagement/Acme.Erp.InventoryManagement.Api/Dockerfile
    - image: acme-erp/inventory-management-ui
      context: .
      docker:
        dockerfile: src/InventoryManagement/Acme.Erp.InventoryManagement.Ui/Dockerfile
    - image: acme-erp/order-fulfilment-api
      context: .
      docker:
        dockerfile: src/OrderFulfilment/Acme.Erp.OrderFulfilment.Api/Dockerfile
    - image: acme-erp/order-fulfilment-ui
      context: .
      docker:
        dockerfile: src/OrderFulfilment/Acme.Erp.OrderFulfilment.Ui/Dockerfile
manifests:
  rawYaml:
    - build/k8s/namespaces/*.yaml
    - build/k8s/sqlserver/*.yaml
    - build/k8s/authentik/blueprint-configmap.yaml
    - build/k8s/gravitee/route-config.yaml
    - build/k8s/services/*.yaml
deploy:
  kubectl: {}
profiles:
  - name: platform
    patches:
      - op: replace
        path: /build/artifacts
        value: []
      - op: replace
        path: /manifests/rawYaml
        value:
          - build/k8s/namespaces/*.yaml
          - build/k8s/sqlserver/*.yaml
          - build/k8s/authentik/blueprint-configmap.yaml
          - build/k8s/gravitee/route-config.yaml
  - name: apps
    patches:
      - op: replace
        path: /manifests/rawYaml
        value:
          - build/k8s/namespaces/*.yaml
          - build/k8s/services/*.yaml
  - name: all

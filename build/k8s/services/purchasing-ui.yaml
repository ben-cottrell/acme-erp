apiVersion: apps/v1
kind: Deployment
metadata:
  name: purchasing-ui
  namespace: erp-local
  labels:
    app.kubernetes.io/name: purchasing-ui
    app.kubernetes.io/part-of: acme-erp
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: purchasing-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: purchasing-ui
        app.kubernetes.io/part-of: acme-erp
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: purchasing-ui
          image: acme-erp/purchasing-ui
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: purchasing-ui
  namespace: erp-local
  labels:
    app.kubernetes.io/name: purchasing-ui
    app.kubernetes.io/part-of: acme-erp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: purchasing-ui
  ports:
    - name: http
      port: 80
      targetPort: http

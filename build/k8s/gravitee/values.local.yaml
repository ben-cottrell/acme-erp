global:
  security:
    allowInsecureImages: true

api:
  replicaCount: 1
  service:
    type: ClusterIP

gateway:
  replicaCount: 1
  service:
    type: ClusterIP
    externalPort: 8082
    internalPort: 8082
  env:
    - name: gravitee_http_header_correlation_enabled
      value: "true"
    - name: gravitee_http_header_correlation_name
      value: X-Correlation-ID

portal:
  replicaCount: 1
  service:
    type: ClusterIP

ui:
  replicaCount: 1
  service:
    type: ClusterIP

mongo:
  enabled: true

mongodb:
  enabled: true
  replicaCount: 1
  podSecurityContext:
    enabled: false
  containerSecurityContext:
    enabled: false
  arbiter:
    enabled: false

es:
  settings:
    number_of_replicas: 0

elasticsearch:
  enabled: true
  sysctlImage:
    enabled: false
  master:
    replicaCount: 1
  data:
    replicaCount: 1
  ingest:
    replicaCount: 1
  coordinating:
    replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

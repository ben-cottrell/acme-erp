global:
  security:
    allowInsecureImages: true

apim:
  dbLess: true

management:
  type: none

ratelimit:
  type: none

api:
  enabled: false
  replicaCount: 1
  service:
    type: ClusterIP

gateway:
  dbLess: true
  replicaCount: 1
  service:
    type: ClusterIP
    externalPort: 8082
    internalPort: 8082
  services:
    sync:
      enabled: true
      kubernetes:
        enabled: true
        namespaces:
          - erp-local
  reporters:
    elasticsearch:
      enabled: false
    file:
      enabled: false
  env:
    - name: gravitee_http_header_correlation_enabled
      value: "true"
    - name: gravitee_http_header_correlation_name
      value: X-Correlation-ID

portal:
  enabled: false
  replicaCount: 1
  service:
    type: ClusterIP

ui:
  enabled: false
  replicaCount: 1
  service:
    type: ClusterIP

mongo:
  enabled: false

mongodb:
  enabled: false
  replicaCount: 1
  podSecurityContext:
    enabled: false
  containerSecurityContext:
    enabled: false
  arbiter:
    enabled: false

es:
  enabled: false
  settings:
    number_of_replicas: 0

elasticsearch:
  enabled: false
  sysctlImage:
    enabled: false
  master:
    replicaCount: 1
  data:
    replicaCount: 1
  ingest:
    replicaCount: 1
  coordinating:
    replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

apiVersion: v1
kind: ConfigMap
metadata:
  name: gravitee-acme-erp-routes
  namespace: erp-local
  labels:
    app.kubernetes.io/name: gravitee-acme-erp-routes
    app.kubernetes.io/part-of: acme-erp
data:
  routes.json: |
    {
      "gatewayHost": "erp.local.test",
      "oidcIssuer": "http://authentik-server.erp-local.svc.cluster.local/application/o/acme-erp/",
      "routes": [
        { "name": "sales-api", "path": "/domain/sales/api", "target": "http://sales-api.erp-local.svc.cluster.local/domain/sales/api", "openApi": "http://sales-api.erp-local.svc.cluster.local/openapi/v1.json" },
        { "name": "purchasing-api", "path": "/domain/purchasing/api", "target": "http://purchasing-api.erp-local.svc.cluster.local/domain/purchasing/api", "openApi": "http://purchasing-api.erp-local.svc.cluster.local/openapi/v1.json" },
        { "name": "inventory-management-api", "path": "/domain/inventory/api", "target": "http://inventory-management-api.erp-local.svc.cluster.local/domain/inventory/api", "openApi": "http://inventory-management-api.erp-local.svc.cluster.local/openapi/v1.json" },
        { "name": "order-fulfilment-api", "path": "/domain/fulfilment/api", "target": "http://order-fulfilment-api.erp-local.svc.cluster.local/domain/fulfilment/api", "openApi": "http://order-fulfilment-api.erp-local.svc.cluster.local/openapi/v1.json" },
        { "name": "sales-assistant-api", "path": "/apps/sales-assistant/api", "target": "http://sales-assistant-api.erp-local.svc.cluster.local/apps/sales-assistant/api", "openApi": "http://sales-assistant-api.erp-local.svc.cluster.local/openapi/v1.json" },
        { "name": "sales-assistant-ui", "path": "/apps/sales-assistant/ui", "target": "http://sales-assistant-ui.erp-local.svc.cluster.local/apps/sales-assistant/ui" },
        { "name": "customer-ordering-api", "path": "/apps/customer-ordering/api", "target": "http://customer-ordering-api.erp-local.svc.cluster.local/apps/customer-ordering/api", "openApi": "http://customer-ordering-api.erp-local.svc.cluster.local/openapi/v1.json" },
        { "name": "customer-ordering-ui", "path": "/apps/customer-ordering/ui", "target": "http://customer-ordering-ui.erp-local.svc.cluster.local/apps/customer-ordering/ui" },
        { "name": "buyer-api", "path": "/apps/buyer/api", "target": "http://buyer-api.erp-local.svc.cluster.local/apps/buyer/api", "openApi": "http://buyer-api.erp-local.svc.cluster.local/openapi/v1.json" },
        { "name": "buyer-ui", "path": "/apps/buyer/ui", "target": "http://buyer-ui.erp-local.svc.cluster.local/apps/buyer/ui" },
        { "name": "warehouse-operator-api", "path": "/apps/warehouse-operator/api", "target": "http://warehouse-operator-api.erp-local.svc.cluster.local/apps/warehouse-operator/api", "openApi": "http://warehouse-operator-api.erp-local.svc.cluster.local/openapi/v1.json" },
        { "name": "warehouse-operator-ui", "path": "/apps/warehouse-operator/ui", "target": "http://warehouse-operator-ui.erp-local.svc.cluster.local/apps/warehouse-operator/ui" },
        { "name": "fulfilment-operator-api", "path": "/apps/fulfilment-operator/api", "target": "http://fulfilment-operator-api.erp-local.svc.cluster.local/apps/fulfilment-operator/api", "openApi": "http://fulfilment-operator-api.erp-local.svc.cluster.local/openapi/v1.json" },
        { "name": "fulfilment-operator-ui", "path": "/apps/fulfilment-operator/ui", "target": "http://fulfilment-operator-ui.erp-local.svc.cluster.local/apps/fulfilment-operator/ui" },
        { "name": "inventory-supervisor-api", "path": "/apps/inventory-supervisor/api", "target": "http://inventory-supervisor-api.erp-local.svc.cluster.local/apps/inventory-supervisor/api", "openApi": "http://inventory-supervisor-api.erp-local.svc.cluster.local/openapi/v1.json" },
        { "name": "inventory-supervisor-ui", "path": "/apps/inventory-supervisor/ui", "target": "http://inventory-supervisor-ui.erp-local.svc.cluster.local/apps/inventory-supervisor/ui" },
        { "name": "fulfilment-supervisor-api", "path": "/apps/fulfilment-supervisor/api", "target": "http://fulfilment-supervisor-api.erp-local.svc.cluster.local/apps/fulfilment-supervisor/api", "openApi": "http://fulfilment-supervisor-api.erp-local.svc.cluster.local/openapi/v1.json" },
        { "name": "fulfilment-supervisor-ui", "path": "/apps/fulfilment-supervisor/ui", "target": "http://fulfilment-supervisor-ui.erp-local.svc.cluster.local/apps/fulfilment-supervisor/ui" }
      ]
    }
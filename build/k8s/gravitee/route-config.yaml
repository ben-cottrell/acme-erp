metadata:
  name: gravitee-acme-erp-route-fulfilment-supervisor-ui
  namespace: erp-local
  labels:
    managed-by: gravitee.io
    gio-type: apidefinitions.gravitee.io
    app.kubernetes.io/part-of: acme-erp
data:
  environmentId: DEFAULT
  apiDefinitionVersion: "4.0.0"
  definition: |
    {
      "id": "acme-erp-fulfilment-supervisor-ui",
      "name": "Fulfilment Supervisor UI",
      "apiVersion": "1.0.0",
      "definitionVersion": "4.0.0",
      "type": "proxy",
      "state": "STARTED",
      "listeners": [
        { "type": "http", "paths": [{ "path": "/apps/fulfilment-supervisor/ui" }], "entrypoints": [{ "type": "http-proxy", "configuration": {} }] }
      ],
      "endpointGroups": [
        { "name": "default-group", "type": "http-proxy", "loadBalancer": { "type": "round-robin" }, "endpoints": [{ "name": "default", "type": "http-proxy", "weight": 1, "inheritConfiguration": false, "configuration": { "target": "http://fulfilment-supervisor-ui.erp-local.svc.cluster.local/apps/fulfilment-supervisor/ui" } }] }
      ],
      "plans": [
        { "id": "acme-erp-fulfilment-supervisor-ui-keyless", "name": "Default Keyless (UNSECURED)", "security": { "type": "key-less" }, "status": "PUBLISHED", "mode": "STANDARD", "flows": [] }
      ]
    }
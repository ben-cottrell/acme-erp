name: CI Docker Images

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version used by GitVersion.
        required: false
        type: string
        default: 10.0.x

permissions:
  contents: read
  packages: write

jobs:
  docker-images:
    name: Build Inspect Publish Image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sales-api
            dockerfile: src/Domain/Sales/Acme.Erp.Sales.Api/Dockerfile
          - image: purchasing-api
            dockerfile: src/Domain/Purchasing/Acme.Erp.Purchasing.Api/Dockerfile
          - image: inventory-management-api
            dockerfile: src/Domain/InventoryManagement/Acme.Erp.InventoryManagement.Api/Dockerfile
          - image: order-fulfilment-api
            dockerfile: src/Domain/OrderFulfilment/Acme.Erp.OrderFulfilment.Api/Dockerfile
          - image: sales-assistant-api
            dockerfile: src/Applications/SalesAssistant/Acme.Erp.SalesAssistant.Api/Dockerfile
          - image: sales-assistant-ui
            dockerfile: src/Applications/SalesAssistant/Acme.Erp.SalesAssistant.Ui/Dockerfile
          - image: customer-ordering-api
            dockerfile: src/Applications/CustomerOrdering/Acme.Erp.CustomerOrdering.Api/Dockerfile
          - image: customer-ordering-ui
            dockerfile: src/Applications/CustomerOrdering/Acme.Erp.CustomerOrdering.Ui/Dockerfile
          - image: buyer-api
            dockerfile: src/Applications/Buyer/Acme.Erp.Buyer.Api/Dockerfile
          - image: buyer-ui
            dockerfile: src/Applications/Buyer/Acme.Erp.Buyer.Ui/Dockerfile
          - image: warehouse-operator-api
            dockerfile: src/Applications/WarehouseOperator/Acme.Erp.WarehouseOperator.Api/Dockerfile
          - image: warehouse-operator-ui
            dockerfile: src/Applications/WarehouseOperator/Acme.Erp.WarehouseOperator.Ui/Dockerfile
          - image: fulfilment-operator-api
            dockerfile: src/Applications/FulfilmentOperator/Acme.Erp.FulfilmentOperator.Api/Dockerfile
          - image: fulfilment-operator-ui
            dockerfile: src/Applications/FulfilmentOperator/Acme.Erp.FulfilmentOperator.Ui/Dockerfile
          - image: inventory-supervisor-api
            dockerfile: src/Applications/InventorySupervisor/Acme.Erp.InventorySupervisor.Api/Dockerfile
          - image: inventory-supervisor-ui
            dockerfile: src/Applications/InventorySupervisor/Acme.Erp.InventorySupervisor.Ui/Dockerfile
          - image: fulfilment-supervisor-api
            dockerfile: src/Applications/FulfilmentSupervisor/Acme.Erp.FulfilmentSupervisor.Api/Dockerfile
          - image: fulfilment-supervisor-ui
            dockerfile: src/Applications/FulfilmentSupervisor/Acme.Erp.FulfilmentSupervisor.Ui/Dockerfile
          - image: security-administration-api
            dockerfile: src/Applications/SecurityAdministration/Acme.Erp.SecurityAdministration.Api/Dockerfile
          - image: security-administration-ui
            dockerfile: src/Applications/SecurityAdministration/Acme.Erp.SecurityAdministration.Ui/Dockerfile
          - image: audit-reporting-api
            dockerfile: src/Applications/AuditReporting/Acme.Erp.AuditReporting.Api/Dockerfile
          - image: audit-reporting-ui
            dockerfile: src/Applications/AuditReporting/Acme.Erp.AuditReporting.Ui/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: 6.x

      - name: Determine GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Determine short SHA
        id: sha
        shell: pwsh
        run: |
          $shortSha = git rev-parse --short=12 HEAD
          "shortSha=$shortSha" >> $env:GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image name
        id: image
        shell: pwsh
        run: |
          $repository = '${{ github.repository }}'.ToLowerInvariant()
          "name=ghcr.io/$repository/${{ matrix.image }}" >> $env:GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build Docker image
        shell: pwsh
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          SEMVER: ${{ steps.gitversion.outputs.semVer }}
          SHORT_SHA: ${{ steps.sha.outputs.shortSha }}
        run: |
          docker build `
            --file '${{ matrix.dockerfile }}' `
            --tag "${env:IMAGE_NAME}:${env:SEMVER}" `
            --tag "${env:IMAGE_NAME}:sha-${env:SHORT_SHA}" `
            .

      - name: Inspect Docker image
        shell: pwsh
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          SEMVER: ${{ steps.gitversion.outputs.semVer }}
          SHORT_SHA: ${{ steps.sha.outputs.shortSha }}
        run: |
          docker image inspect "${env:IMAGE_NAME}:${env:SEMVER}"
          docker image inspect "${env:IMAGE_NAME}:sha-${env:SHORT_SHA}"

      - name: Publish Docker image
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          SEMVER: ${{ steps.gitversion.outputs.semVer }}
          SHORT_SHA: ${{ steps.sha.outputs.shortSha }}
        run: |
          docker push "${env:IMAGE_NAME}:${env:SEMVER}"
          docker push "${env:IMAGE_NAME}:sha-${env:SHORT_SHA}"
name: CI CodeQL

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version used for CodeQL build analysis.
        required: false
        type: string
        default: 10.0.x
      configuration:
        description: Build configuration used for CodeQL analysis.
        required: false
        type: string
        default: Release

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: Analyze C#
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Restore dependencies
        run: dotnet restore Acme.Erp.sln

      - name: Build for CodeQL analysis
        run: dotnet build Acme.Erp.sln --configuration ${{ inputs.configuration }} --no-restore -warnaserror /p:TreatWarningsAsErrors=true /p:ContinuousIntegrationBuild=true

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
